<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Café do IBT · Dashboard de vendas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Lora:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:#171210;color:#F2E9DB;font-family:'Archivo',sans-serif;}
  a{color:#D9A05B;text-decoration:none;} a:hover{color:#E8C285;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .wrap{min-height:100vh;padding:28px 32px 48px;max-width:1280px;margin:0 auto;}
  header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px;}
  .brand{font-family:'Lora',serif;font-style:italic;font-size:15px;color:#D9A05B;}
  h1{margin:2px 0;font-family:'Lora',serif;font-weight:600;font-size:30px;letter-spacing:-0.01em;color:#F7F0E4;}
  .meta{font-size:12.5px;color:#A6937D;}
  .controls{display:flex;align-items:center;gap:10px;}
  .seg{display:flex;gap:4px;background:#221B15;border:1px solid #372C20;border-radius:10px;padding:4px;}
  .seg button, .seg2 button{border:none;cursor:pointer;font-family:'Archivo',sans-serif;font-weight:600;background:transparent;color:#A6937D;border-radius:7px;}
  .seg button{font-size:13px;padding:7px 14px;}
  .seg2{display:flex;gap:3px;background:#221B15;border:1px solid #372C20;border-radius:8px;padding:3px;}
  .seg2 button{font-size:12px;padding:5px 10px;border-radius:5px;}
  .seg button.on,.seg2 button.on{background:#3A2D1D;color:#F2E9DB;}
  .chip{border:1px solid #372C20;cursor:pointer;background:transparent;color:#A6937D;font-family:'Archivo',sans-serif;font-size:12px;font-weight:600;padding:6px 10px;border-radius:8px;}
  .chip.on{background:#3A2D1D;color:#F2E9DB;border-color:#D9A05B;}
  .refresh{border:1px solid #4A3A28;cursor:pointer;background:#2A2118;color:#E8C285;font-family:'Archivo',sans-serif;font-size:13px;font-weight:600;padding:11px 16px;border-radius:10px;}
  .refresh:hover{background:#332818;}
  .card{background:#201914;border:1px solid #372C20;border-radius:14px;padding:20px 22px;}
  .filters{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-radius:12px;padding:12px 16px;}
  .filters .fl{font-size:12px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:#A6937D;}
  select,input[type=text],input[type=date],input[type=month]{background:#2A2118;color:#F2E9DB;border:1px solid #4A3A28;border-radius:8px;padding:8px 10px;font-family:'Archivo',sans-serif;font-size:13px;outline:none;color-scheme:dark;}
  input[type=date],input[type=month]{border-radius:10px;padding:9px 12px;}
  select{cursor:pointer;max-width:260px;}
  select option{background:#201914;color:#F2E9DB;}
  .clearbtn{border:none;cursor:pointer;background:transparent;color:#D9A05B;font-family:'Archivo',sans-serif;font-size:13px;font-weight:600;text-decoration:underline;padding:8px 6px;}
  .grid-kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;}
  .kpi{display:flex;flex-direction:column;gap:6px;padding:18px 20px;}
  .kpi .l{font-size:12px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:#A6937D;}
  .kpi .v{font-size:28px;font-weight:700;letter-spacing:-0.02em;color:#F7F0E4;}
  .kpi .s{font-size:12.5px;color:#A6937D;}
  .sect-title{font-family:'Lora',serif;font-size:17px;font-weight:600;color:#F7F0E4;}
  .sect-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
  .stack{display:flex;flex-direction:column;gap:16px;}
  .grid-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;align-items:start;}
  .grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px;align-items:start;}
  .evo{display:flex;gap:10px;}
  .evo .ylab{display:flex;flex-direction:column;justify-content:space-between;height:200px;font-size:10.5px;color:#A6937D;text-align:right;min-width:56px;}
  .evo .plot{flex:1;position:relative;height:200px;border-bottom:1px solid #372C20;}
  .evo svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;}
  .evo .cols{position:absolute;inset:0;display:flex;}
  .evo .cols div{flex:1;height:100%;}
  .evo .cols div:hover{background:rgba(217,160,91,0.08);}
  .xlabs{display:flex;margin-left:66px;margin-top:6px;}
  .xlabs div{flex:1;font-size:10px;color:#A6937D;text-align:center;white-space:nowrap;}
  .hbars{display:flex;align-items:flex-end;gap:4px;height:120px;}
  .hbars .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;height:100%;}
  .hbars .bar{width:100%;max-width:26px;border-radius:5px 5px 2px 2px;background:#8C6A45;min-height:2px;}
  .hbars .val{font-size:10px;font-weight:600;color:#A6937D;}
  .hbars .lbl{font-size:10px;color:#A6937D;}
  .ptlbl{position:absolute;transform:translate(-50%,-130%);font-size:10.5px;font-weight:600;color:#E8C285;white-space:nowrap;pointer-events:none;}
  .wbars{display:flex;align-items:flex-end;gap:6px;height:120px;}
  .wbars .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;height:100%;}
  .wbars .val{font-size:10px;font-weight:600;color:#A6937D;white-space:nowrap;}
  .wbars .bar{width:100%;max-width:34px;border-radius:5px 5px 2px 2px;min-height:2px;}
  .wbars .lbl{font-size:10.5px;color:#A6937D;}
  .rows{display:flex;flex-direction:column;gap:12px;}
  .row .top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;}
  .row .top b{font-weight:600;} .row .top span{color:#A6937D;}
  .track{height:8px;border-radius:4px;background:#2E2418;overflow:hidden;}
  .track>div{height:100%;border-radius:4px;}
  .prod{display:grid;grid-template-columns:26px minmax(0,1fr) auto 88px;gap:10px;align-items:center;}
  .prod .rank{font-size:12px;font-weight:700;color:#D9A05B;}
  .prod .name{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .prod .track{height:6px;margin-top:5px;}
  .prod .unit{font-size:12px;color:#A6937D;text-align:right;white-space:nowrap;}
  .prod .rev{font-size:13px;font-weight:700;text-align:right;}
  .footnote{font-size:11.5px;color:#6E6152;text-align:center;}
  .loading{display:flex;flex-direction:column;align-items:center;gap:14px;padding:120px 0;color:#A6937D;font-size:14px;}
  .spinner{width:34px;height:34px;border-radius:50%;border:3px solid #372C20;border-top-color:#D9A05B;animation:spin .8s linear infinite;}
  .errbox{max-width:520px;margin:80px auto;border-color:#6B3A28;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;}
  .errbox .t{font-family:'Lora',serif;font-size:19px;font-weight:600;color:#E08A66;}
  .errbox .m{font-size:13.5px;color:#A6937D;line-height:1.5;}
  .errbox button{border:none;cursor:pointer;background:#D9A05B;color:#241A10;font-family:'Archivo',sans-serif;font-size:13px;font-weight:700;padding:10px 22px;border-radius:9px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="brand">Café do IBT</div>
      <h1>Dashboard de vendas</h1>
      <div class="meta" id="meta">Dados Saipos · carregando…</div>
    </div>
    <div class="controls">
      <div class="seg" id="modes"></div>
      <span id="periodCtl" style="display:flex;align-items:center;gap:10px;"></span>
      <button class="refresh" onclick="load()">Atualizar</button>
    </div>
  </header>
  <div id="content"></div>
</div>
<script>
const REFRESH_MINUTES = 5;
const PERIODS = [7, 15, 30];
const FN = '/.netlify/functions/saipos';
const TYPE_NAMES = { 1: 'Entrega', 2: 'Balcão / retirada', 3: 'Salão', 4: 'Ficha / senha' };
const WD = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];

let days = 15, lastUpdate = null;
let mode = 'months', dateSel = '', monthSel = '', rangeStart = '', rangeEnd = '';
let monthsSel = [];
const MN = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
const PALETTE = ['#E8B36A', '#9DBA7F', '#8FB7D9', '#D98F8F', '#C1A0E8', '#8AD9C3', '#E8D98F', '#A0AED9', '#B5D98F', '#D9A0C8', '#8FD9D9', '#D9B58F'];
let rawSales = [], rawItems = [];
let F = { metric: 'rev', channel: 'all', payment: 'all', product: 'all', prodSearch: '', prodMetric: 'rev' };

const pad = n => String(n).padStart(2, '0');
const fmtDate = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const brl = v => v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const brl0 = v => v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 });
const pct = v => (v * 100).toLocaleString('pt-BR', { maximumFractionDigits: 0 }) + '%';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
// horas após a meia-noite pertencem ao turno do dia anterior → ordenadas no fim do eixo
const shiftHour = s => {
  const h = parseInt((s.created_at || '').slice(11, 13), 10);
  if (isNaN(h)) return null;
  return (s.created_at || '').slice(0, 10) > (s.shift_date || '') ? h + 24 : h;
};

const apiCache = {};
async function apiPage(endpoint, params) {
  const qs = new URLSearchParams(params).toString();
  let lastMsg = '';
  for (let attempt = 0; attempt < 6; attempt++) {
    if (attempt) await new Promise(res => setTimeout(res, Math.min(8000, 1000 * Math.pow(2, attempt - 1))));
    let r;
    try { r = await fetch(`${FN}?endpoint=${endpoint}&${qs}`); }
    catch (e) { lastMsg = 'Falha de rede'; continue; }
    if (r.ok) return r.json();
    lastMsg = 'HTTP ' + r.status;
    try { lastMsg += ' — ' + ((await r.json()).message || ''); } catch (e) {}
    if (r.status < 500 && r.status !== 429) throw new Error(lastMsg);
  }
  throw new Error(lastMsg + ' (a API da Saipos está instável no momento — tentamos 6 vezes; aguarde alguns minutos)');
}

async function fetchAll(endpoint, startStr, endStr) {
  // cache: períodos já encerrados não mudam; período atual vale por 4 min
  const key = endpoint + '|' + startStr + '|' + endStr;
  const hit = apiCache[key];
  if (hit && (endStr < fmtDate(new Date()) || Date.now() - hit.t < 4 * 60 * 1000)) return hit.rows;
  const rows = [];
  for (let offset = 0, i = 0; i < 12; i++, offset += 1000) {
    const page = await apiPage(endpoint, {
      p_date_column_filter: 'shift_date',
      p_filter_date_start: startStr + 'T00:00:00',
      p_filter_date_end: endStr + 'T23:59:59',
      p_limit: 1000, p_offset: offset,
    });
    rows.push(...page);
    if (page.length < 1000) break;
  }
  apiCache[key] = { rows, t: Date.now() };
  return rows;
}

function renderControls() {
  document.getElementById('modes').innerHTML = [['months', 'Meses'], ['day', 'Dia']].map(([k, l]) =>
    `<button class="${mode === k ? 'on' : ''}" onclick="setMode('${k}')">${l}</button>`).join('');
  const c = document.getElementById('periodCtl');
  if (mode === 'months') {
    const now = new Date();
    let html = '';
    for (let i = 11; i >= 0; i--) {
      const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
      const mk = fmtDate(d).slice(0, 7);
      html += `<button class="chip ${monthsSel.includes(mk) ? 'on' : ''}" onclick="toggleMonth('${mk}')">${MN[d.getMonth()]}/${String(d.getFullYear()).slice(2)}</button>`;
    }
    c.innerHTML = `<span style="display:flex;gap:5px;flex-wrap:wrap;max-width:600px;">${html}</span>`;
  }
  else if (mode === 'day') c.innerHTML = `<input type="date" value="${dateSel}" onchange="setDateSel(this.value)">`;
  else c.innerHTML = '';
}
function setMode(m) { mode = m; renderControls(); load(); }
function toggleMonth(mk) {
  const m = monthsSel.includes(mk) ? monthsSel.filter(x => x !== mk) : [...monthsSel, mk];
  if (!m.length) return;
  monthsSel = m.sort(); renderControls(); load();
}
function setDateSel(v) { if (v) { dateSel = v; load(); } }
function setMonthSel(v) { if (v) { monthSel = v; load(); } }
function setRangeStart(v) { if (v) { rangeStart = v; load(); } }
function setRangeEnd(v) { if (v) { rangeEnd = v; load(); } }
function monthRange(mk) {
  const [y, m] = mk.split('-').map(Number);
  const start = new Date(y, m - 1, 1);
  let end = new Date(y, m, 0);
  const today = new Date();
  if (end > today && start <= today) end = today;
  return { start, end };
}
function loadRanges() {
  if (mode === 'months' && monthsSel.length) return monthsSel.slice().sort().map(monthRange);
  return [range()];
}
function range() {
  if (mode === 'day' && dateSel) {
    const [y, m, d] = dateSel.split('-').map(Number);
    const dt = new Date(y, m - 1, d);
    return { start: dt, end: new Date(dt) };
  }
  if (mode === 'range' && rangeStart && rangeEnd) {
    const parse = v => { const [y, m, d] = v.split('-').map(Number); return new Date(y, m - 1, d); };
    let a = parse(rangeStart), b = parse(rangeEnd);
    if (a > b) { const t = a; a = b; b = t; }
    return { start: a, end: b };
  }
  if (mode === 'month' && monthSel) {
    const [y, m] = monthSel.split('-').map(Number);
    const start = new Date(y, m - 1, 1);
    let end = new Date(y, m, 0);
    const today = new Date();
    if (end > today && start <= today) end = today;
    return { start, end };
  }
  const end = new Date();
  const start = new Date(); start.setDate(start.getDate() - (days - 1));
  return { start, end };
}
function setF(k, v) { F[k] = v; render(); }
function clearFilters() { F.channel = 'all'; F.payment = 'all'; F.product = 'all'; render(); }
function setMeta(txt) { document.getElementById('meta').textContent = txt; }

let loadSeq = 0;
async function load() {
  const seq = ++loadSeq;
  renderControls();
  document.getElementById('content').innerHTML =
    '<div class="loading"><div class="spinner"></div>Buscando vendas na Saipos…</div>';
  try {
    const chunks = [];
    for (const { start, end } of loadRanges()) {
      for (let s = new Date(start); s <= end;) {
        const e = new Date(s); e.setDate(e.getDate() + 13);
        const ce = e < end ? e : end;
        chunks.push([fmtDate(s), fmtDate(ce)]);
        s = new Date(ce); s.setDate(s.getDate() + 1);
      }
    }
    const localSales = [], localItems = [];
    for (const [cs, ce] of chunks) {
      const [sv, iv] = await Promise.all([fetchAll('search_sales', cs, ce), fetchAll('sales_items', cs, ce)]);
      localSales.push(...sv); localItems.push(...iv);
    }
    if (seq !== loadSeq) return;
    rawSales = localSales; rawItems = localItems;
    lastUpdate = new Date();
    setMeta('Dados Saipos · atualizado ' + lastUpdate.toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) + ' · auto-atualiza a cada ' + REFRESH_MINUTES + ' min');
    render();
  } catch (e) {
    if (seq !== loadSeq) return;
    document.getElementById('content').innerHTML = `
      <div class="card errbox">
        <div class="t">Não foi possível carregar os dados</div>
        <div class="m">${esc(e.message || e)}<br>Verifique se a function do Netlify está publicada e se a variável SAIPOS_TOKEN está configurada.</div>
        <button onclick="load()">Tentar novamente</button>
      </div>`;
  }
}

function render() {
  const valid = rawSales.filter(s => s.canceled !== 'Y');
  const canceledCount = rawSales.length - valid.length;

  const prodsBySale = {};
  for (const row of rawItems) {
    const set = prodsBySale[row.id_sale] || (prodsBySale[row.id_sale] = new Set());
    for (const it of (row.items || [])) if (it.deleted !== 'Y') set.add(it.desc_sale_item || '—');
  }

  const paySet = new Set(), chanSet = new Set(), prodTot = {};
  for (const s of valid) {
    chanSet.add(String(s.id_sale_type));
    for (const p of (s.payments || [])) paySet.add(p.desc_store_payment_type || 'Outros');
  }
  const validIdsAll = new Set(valid.map(s => s.id_sale));
  for (const row of rawItems) {
    if (!validIdsAll.has(row.id_sale)) continue;
    for (const it of (row.items || [])) if (it.deleted !== 'Y') {
      const k = it.desc_sale_item || '—';
      prodTot[k] = (prodTot[k] || 0) + (it.quantity || 0) * (it.unit_price || 0);
    }
  }

  let sales = valid;
  if (F.channel !== 'all') sales = sales.filter(s => String(s.id_sale_type) === F.channel);
  if (F.payment !== 'all') sales = sales.filter(s => (s.payments || []).some(p => (p.desc_store_payment_type || 'Outros') === F.payment));
  if (F.product !== 'all') sales = sales.filter(s => (prodsBySale[s.id_sale] || new Set()).has(F.product));
  const ids = new Set(sales.map(s => s.id_sale));
  const filtersActive = F.channel !== 'all' || F.payment !== 'all' || F.product !== 'all';

  const items = [];
  for (const row of rawItems) {
    if (!ids.has(row.id_sale)) continue;
    for (const it of (row.items || [])) if (it.deleted !== 'Y') items.push(it);
  }
  const revenue = sales.reduce((a, s) => a + (s.total_amount || 0), 0);
  const orders = sales.length;
  const ticket = orders ? revenue / orders : 0;
  const itemCount = items.reduce((a, i) => a + (i.quantity || 0), 0);

  const byDay = {};
  for (const s of sales) {
    byDay[s.shift_date] = byDay[s.shift_date] || { rev: 0, n: 0 };
    byDay[s.shift_date].rev += s.total_amount || 0; byDay[s.shift_date].n++;
  }
  let selRanges;
  if (mode === 'months' && monthsSel.length) {
    selRanges = monthsSel.slice().sort().map((mk, i) => {
      const r = monthRange(mk);
      const [y, m] = mk.split('-').map(Number);
      return { ...r, label: MN[m - 1] + '/' + String(y).slice(2), color: PALETTE[i % PALETTE.length] };
    });
  } else {
    selRanges = [{ ...range(), label: '', color: '#E8B36A' }];
  }
  const rngStart = selRanges[0].start, rngEnd = selRanges[selRanges.length - 1].end;
  const perRange = selRanges.map(r => {
    const span = Math.round((new Date(r.end.getFullYear(), r.end.getMonth(), r.end.getDate()) - new Date(r.start.getFullYear(), r.start.getMonth(), r.start.getDate())) / 864e5) + 1;
    const arr = [];
    for (let i = 0; i < span; i++) {
      const d = new Date(r.start.getFullYear(), r.start.getMonth(), r.start.getDate() + i);
      const v = byDay[fmtDate(d)] || { rev: 0, n: 0 };
      arr.push({ d, rev: v.rev, n: v.n, ticket: v.n ? v.rev / v.n : 0 });
    }
    return { ...r, days: arr };
  });
  const daily = perRange.flatMap(r => r.days);
  const spanDays = daily.length;
  const isCompare = selRanges.length > 1;

  // evolution chart
  const metricDefs = { rev: ['Faturamento', x => x.rev, brl0], n: ['Pedidos', x => x.n, v => Math.round(v).toLocaleString('pt-BR')], ticket: ['Ticket médio', x => x.ticket, brl0] };
  const [mLabel, mGet, mFmt] = metricDefs[F.metric];
  let evoSvg, evoCols, xlabs, evoLbls, maxV;
  if (isCompare) {
    const W = 800, H = 200;
    const n = Math.max(...perRange.map(r => r.days.length));
    const allSeries = perRange.map(r => r.days.map(mGet));
    maxV = Math.max(1, ...allSeries.flat());
    const px = i => n > 1 ? i / (n - 1) * W : W / 2;
    const py = v => H - (v / maxV) * (H - 10);
    const paths = allSeries.map((ser, ri) => `<path d="M${ser.map((v, i) => `${px(i).toFixed(1)},${py(v).toFixed(1)}`).join(' L')}" fill="none" stroke="${perRange[ri].color}" stroke-width="2.5" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>`).join('');
    evoSvg = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><line x1="0" y1="${py(maxV / 2)}" x2="${W}" y2="${py(maxV / 2)}" stroke="#372C20" stroke-width="1" stroke-dasharray="4 4"/>${paths}</svg>`;
    evoCols = Array.from({ length: n }, (_, i) => `<div title="${esc('Dia ' + (i + 1) + ' — ' + perRange.map((r, ri) => r.days[i] ? r.label + ': ' + mFmt(allSeries[ri][i]) : null).filter(Boolean).join(' · '))}"></div>`).join('');
    const step = Math.max(1, Math.ceil(n / 10));
    xlabs = Array.from({ length: n }, (_, i) => `<div>${(i % step === 0 || i === n - 1) ? (i + 1) : ''}</div>`).join('');
    evoLbls = '';
  } else {
  let evoPts;
  if (spanDays === 1) {
    const byH = {};
    for (const s of sales) {
      const k = shiftHour(s);
      if (k !== null) { byH[k] = byH[k] || { rev: 0, n: 0 }; byH[k].rev += s.total_amount || 0; byH[k].n++; }
    }
    const ks = Object.keys(byH).map(Number);
    const lo = ks.length ? Math.min(...ks) : 8, hi = ks.length ? Math.max(...ks) : 18;
    evoPts = [];
    for (let k = lo; k <= hi; k++) {
      const v = byH[k] || { rev: 0, n: 0 };
      evoPts.push({ xLabel: (k % 24) + 'h', tipDate: (k % 24) + 'h–' + ((k + 1) % 24) + 'h' + (k >= 24 ? ' (madrugada)' : ''), rev: v.rev, n: v.n, ticket: v.n ? v.rev / v.n : 0 });
    }
  } else {
    evoPts = daily.map(x => ({
      xLabel: spanDays > 15 ? x.d.getDate() + '/' + (x.d.getMonth() + 1) : WD[x.d.getDay()] + ' ' + x.d.getDate(),
      tipDate: x.d.toLocaleDateString('pt-BR'), rev: x.rev, n: x.n, ticket: x.ticket,
    }));
  }
  const series = evoPts.map(mGet);
  maxV = Math.max(1, ...series);
  const W = 800, H = 200, n = series.length;
  const px = i => n > 1 ? i / (n - 1) * W : W / 2;
  const py = v => H - (v / maxV) * (H - 10);
  const linePts = series.map((v, i) => `${px(i).toFixed(1)},${py(v).toFixed(1)}`).join(' L');
  const lineD = 'M' + linePts;
  const areaD = lineD + ` L${W},${H} L0,${H} Z`;
  const dots = evoPts.map((x, i) => (x.n || F.metric !== 'rev') ? `<circle cx="${px(i).toFixed(1)}" cy="${py(series[i]).toFixed(1)}" r="3" fill="#E8B36A"/>` : '').join('');
  evoSvg = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <defs><linearGradient id="gEvo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D9A05B" stop-opacity="0.35"/><stop offset="100%" stop-color="#D9A05B" stop-opacity="0.02"/>
    </linearGradient></defs>
    <line x1="0" y1="${py(maxV / 2)}" x2="${W}" y2="${py(maxV / 2)}" stroke="#372C20" stroke-width="1" stroke-dasharray="4 4"/>
    <path d="${areaD}" fill="url(#gEvo)"/>
    <path d="${lineD}" fill="none" stroke="#E8B36A" stroke-width="2.5" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>${dots}</svg>`;
  evoCols = evoPts.map((x, i) =>
    `<div title="${esc(x.tipDate + ' · ' + mLabel + ': ' + mFmt(series[i]) + ' · ' + x.n + ' pedidos · ' + brl(x.rev))}"></div>`).join('');
  const step = Math.max(1, Math.ceil(n / 10));
  xlabs = evoPts.map((x, i) =>
    `<div>${(i % step === 0 || i === n - 1) ? x.xLabel : ''}</div>`).join('');
  evoLbls = evoPts.map((x, i) => ((i % step === 0 || i === n - 1) && series[i] > 0)
    ? `<div class="ptlbl" style="left:${(n > 1 ? i / (n - 1) * 100 : 50).toFixed(2)}%;top:${(py(series[i]) / H * 100).toFixed(2)}%">${mFmt(series[i])}</div>` : '').join('');
  }
  const legendHtml = isCompare ? perRange.map(r => `<div style="display:flex;align-items:center;gap:6px;font-size:12.5px;color:#A6937D;"><span style="width:10px;height:10px;border-radius:3px;background:${r.color};display:inline-block;"></span>${r.label}</div>`).join('') : '';
  let compareHtml = '';
  if (isCompare) {
    const totals = perRange.map(r => ({ rev: r.days.reduce((a, x) => a + x.rev, 0), n: r.days.reduce((a, x) => a + x.n, 0) }));
    const maxRevM = Math.max(1, ...totals.map(t => t.rev));
    compareHtml = `<div class="card"><div class="sect-title" style="margin-bottom:14px">Comparação de meses</div><div class="rows">` + perRange.map((r, i) => {
      const t = totals[i], prev = i ? totals[i - 1].rev : null, delta = prev ? (t.rev - prev) / prev : null;
      return `<div style="display:grid;grid-template-columns:76px minmax(0,1fr) 130px 90px 110px;gap:12px;align-items:center;">
        <div style="display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;"><span style="width:10px;height:10px;border-radius:3px;background:${r.color};flex-shrink:0;"></span>${r.label}</div>
        <div class="track" style="height:10px"><div style="background:${r.color};width:${Math.round(t.rev / maxRevM * 100)}%"></div></div>
        <div style="text-align:right"><div style="font-size:13.5px;font-weight:700">${brl0(t.rev)}</div><div style="font-size:11px;white-space:nowrap;color:${delta === null ? '#A6937D' : delta >= 0 ? '#9DBA7F' : '#E08A66'}">${delta === null ? '' : (delta >= 0 ? '+' : '') + (delta * 100).toLocaleString('pt-BR', { maximumFractionDigits: 0 }) + '% vs ' + perRange[i - 1].label}</div></div>
        <div style="font-size:12.5px;color:#A6937D;text-align:right">${t.n.toLocaleString('pt-BR')} pedidos</div>
        <div style="font-size:12.5px;color:#A6937D;text-align:right">ticket ${brl(t.n ? t.rev / t.n : 0)}</div>
      </div>`;
    }).join('') + `</div></div>`;
  }
  const metricTabsHtml = Object.entries(metricDefs).map(([k, [label]]) =>
    `<button class="${F.metric === k ? 'on' : ''}" onclick="setF('metric','${k}')">${label}</button>`).join('');

  // hourly
  const byHour = {};
  for (const s of sales) { const k = shiftHour(s); if (k !== null) byHour[k] = (byHour[k] || 0) + 1; }
  const hks = Object.keys(byHour).map(Number);
  const hMin = hks.length ? Math.min(...hks) : 8, hMax = hks.length ? Math.max(...hks) : 18;
  const maxH = Math.max(1, ...Object.values(byHour));
  let hourlyHtml = '';
  for (let k = hMin; k <= hMax; k++) {
    hourlyHtml += `<div class="col" title="${(byHour[k] || 0)} pedidos entre ${k % 24}h e ${(k + 1) % 24}h${k >= 24 ? ' (madrugada — turno do dia anterior)' : ''}">
      <div class="val">${byHour[k] || ''}</div>
      <div class="bar" style="height:${Math.round((byHour[k] || 0) / maxH * 100)}%"></div><div class="lbl">${k % 24}h</div></div>`;
  }

  // weekday averages
  const wdAgg = Array.from({ length: 7 }, () => ({ rev: 0, ds: new Set() }));
  for (const x of daily) if (x.n) { wdAgg[x.d.getDay()].rev += x.rev; wdAgg[x.d.getDay()].ds.add(fmtDate(x.d)); }
  const wdAvg = wdAgg.map(a => a.ds.size ? a.rev / a.ds.size : 0);
  const maxWd = Math.max(1, ...wdAvg);
  const weekdayHtml = [1, 2, 3, 4, 5, 6, 0].map(i => `
    <div class="col" title="média de ${esc(brl(wdAvg[i]))} em ${wdAgg[i].ds.size} ${WD[i]}">
      <div class="val">${wdAvg[i] ? brl0(wdAvg[i]).replace(/\u00a0/g, '') : '—'}</div>
      <div class="bar" style="background:${(i === 0 || i === 6) ? '#D9A05B' : '#8C6A45'};height:${Math.round(wdAvg[i] / maxWd * 100)}%"></div>
      <div class="lbl">${WD[i]}</div></div>`).join('');

  // payments
  const byPay = {};
  for (const s of sales) for (const p of (s.payments || [])) {
    const k = p.desc_store_payment_type || 'Outros';
    byPay[k] = (byPay[k] || 0) + (p.payment_amount || 0);
  }
  const payTotal = Object.values(byPay).reduce((a, b) => a + b, 0) || 1;
  const payHtml = Object.entries(byPay).sort((a, b) => b[1] - a[1]).map(([name, amt]) => `
    <div class="row"><div class="top"><b>${esc(name)}</b><span>${brl0(amt)} · ${pct(amt / payTotal)}</span></div>
    <div class="track"><div style="background:#D9A05B;width:${Math.round(amt / payTotal * 100)}%"></div></div></div>`).join('');

  // channels
  const byType = {};
  for (const s of sales) byType[s.id_sale_type] = (byType[s.id_sale_type] || 0) + 1;
  const typeHtml = Object.entries(byType).sort((a, b) => b[1] - a[1]).map(([t, cnt]) => `
    <div class="row"><div class="top"><b>${TYPE_NAMES[t] || 'Tipo ' + t}</b><span>${cnt} pedidos · ${pct(cnt / (orders || 1))}</span></div>
    <div class="track"><div style="background:#8C6A45;width:${Math.round(cnt / (orders || 1) * 100)}%"></div></div></div>`).join('');

  // top products
  const byProd = {};
  for (const it of items) {
    const k = it.desc_sale_item || '—';
    byProd[k] = byProd[k] || { qty: 0, rev: 0 };
    byProd[k].qty += it.quantity || 0;
    byProd[k].rev += (it.quantity || 0) * (it.unit_price || 0);
  }
  const q = norm(F.prodSearch.trim());
  let prodList = Object.entries(byProd).filter(([name]) => !q || norm(name).includes(q));
  prodList.sort((a, b) => F.prodMetric === 'qty' ? b[1].qty - a[1].qty : b[1].rev - a[1].rev);
  prodList = prodList.slice(0, 10);
  const maxProd = prodList.length ? (F.prodMetric === 'qty' ? prodList[0][1].qty : prodList[0][1].rev) : 1;
  const prodHtml = prodList.length ? prodList.map(([name, v], i) => `
    <div class="prod"><div class="rank">${i + 1}</div>
      <div style="min-width:0" title="${esc(name)}"><div class="name">${esc(name)}</div>
      <div class="track"><div style="background:#D9A05B;width:${Math.max(2, Math.round((F.prodMetric === 'qty' ? v.qty : v.rev) / maxProd * 100))}%"></div></div></div>
      <div class="unit">${v.qty.toLocaleString('pt-BR')} un · ${v.qty ? brl(v.rev / v.qty) + '/un' : '—'}</div><div class="rev">${brl(v.rev)}</div></div>`).join('')
    : `<div style="font-size:13px;color:#A6937D;padding:12px 0;">Nenhum produto encontrado para "${esc(F.prodSearch)}".</div>`;
  const prodTabsHtml = [['rev', 'receita'], ['qty', 'quantidade']].map(([k, label]) =>
    `<button class="${F.prodMetric === k ? 'on' : ''}" onclick="setF('prodMetric','${k}')">${label}</button>`).join('');

  // filter selects
  const opt = (v, label, cur) => `<option value="${esc(v)}" ${v === cur ? 'selected' : ''}>${esc(label)}</option>`;
  const chanSel = `<select onchange="setF('channel',this.value)">${opt('all', 'Todos os canais', F.channel)}${[...chanSet].sort().map(t => opt(t, TYPE_NAMES[t] || 'Tipo ' + t, F.channel)).join('')}</select>`;
  const paySel = `<select onchange="setF('payment',this.value)">${opt('all', 'Todos os pagamentos', F.payment)}${[...paySet].sort().map(p => opt(p, p, F.payment)).join('')}</select>`;
  const prodSel = `<select onchange="setF('product',this.value)">${opt('all', 'Todos os produtos', F.product)}${Object.entries(prodTot).sort((a, b) => b[1] - a[1]).slice(0, 40).map(([p]) => opt(p, p, F.product)).join('')}</select>`;
  const noteParts = [];
  if (F.channel !== 'all') noteParts.push(TYPE_NAMES[F.channel] || F.channel);
  if (F.payment !== 'all') noteParts.push(F.payment);
  if (F.product !== 'all') noteParts.push('vendas com "' + F.product + '"');
  const clearHtml = filtersActive
    ? `<button class="clearbtn" onclick="clearFilters()">limpar filtros</button><span style="font-size:12px;color:#A6937D;">mostrando: ${esc(noteParts.join(' · '))}</span>` : '';

  const kpis = [
    { l: 'Faturamento', v: brl(revenue), s: filtersActive ? 'com filtros aplicados' : (mode === 'day' ? rngStart.toLocaleDateString('pt-BR') : mode === 'months' ? selRanges.map(r => r.label).join(', ') : mode === 'range' ? rngStart.toLocaleDateString('pt-BR') + ' – ' + rngEnd.toLocaleDateString('pt-BR') : 'últimos ' + days + ' dias') },
    { l: 'Pedidos', v: orders.toLocaleString('pt-BR'), s: filtersActive ? 'de ' + valid.length + ' no período' : (canceledCount ? canceledCount + ' cancelados' : 'nenhum cancelado') },
    { l: 'Ticket médio', v: brl(ticket), s: 'por pedido' },
    { l: 'Itens vendidos', v: itemCount.toLocaleString('pt-BR'), s: (orders ? (itemCount / orders).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) : '0') + ' itens/pedido' },
  ];

  document.getElementById('content').innerHTML = `
    <div class="stack">
      <div class="card filters">
        <span class="fl">Filtros</span>${chanSel}${paySel}${prodSel}${clearHtml}
      </div>
      <div class="grid-kpi">${kpis.map(k => `<div class="card kpi"><div class="l">${k.l}</div><div class="v">${k.v}</div><div class="s">${k.s}</div></div>`).join('')}</div>
      ${compareHtml}
      <div class="card">
        <div class="sect-head"><div class="sect-title">${isCompare ? 'Evolução por dia do mês' : 'Evolução diária'}</div><div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;">${legendHtml}<div class="seg2">${metricTabsHtml}</div></div></div>
        <div class="evo">
          <div class="ylab"><span>${mFmt(maxV)}</span><span>${mFmt(maxV / 2)}</span><span>0</span></div>
          <div class="plot">${evoSvg}${evoLbls}<div class="cols">${evoCols}</div></div>
        </div>
        <div class="xlabs">${xlabs}</div>
      </div>
      <div class="grid-3">
        <div class="card"><div class="sect-title" style="margin-bottom:16px">Pedidos por horário</div><div class="hbars">${hourlyHtml}</div></div>
        <div class="card"><div class="sect-head" style="margin-bottom:16px"><div class="sect-title">Dia da semana</div><div class="meta">faturamento médio</div></div><div class="wbars">${weekdayHtml}</div></div>
        <div class="card"><div class="sect-title" style="margin-bottom:12px">Canal de venda</div><div class="rows">${typeHtml}</div></div>
      </div>
      <div class="grid-2">
        <div class="card"><div class="sect-title" style="margin-bottom:12px">Formas de pagamento</div><div class="rows">${payHtml}</div></div>
        <div class="card">
          <div class="sect-head">
            <div class="sect-title">Produtos mais vendidos</div>
            <div style="display:flex;gap:8px;align-items:center;">
              <input type="text" placeholder="buscar produto…" style="width:150px" value="${esc(F.prodSearch)}" oninput="setF('prodSearch',this.value);this.focus()">
              <div class="seg2">${prodTabsHtml}</div>
            </div>
          </div>
          <div class="rows" style="gap:10px">${prodHtml}</div>
        </div>
      </div>
      <div class="footnote">Vendas canceladas e itens excluídos não entram nos totais. Em horários de pico a Saipos pode atualizar os dados com atraso de até 1 dia.</div>
    </div>`;

  const inp = document.querySelector('.sect-head input[type=text]');
  if (inp && F.prodSearch) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
}

dateSel = fmtDate(new Date());
monthSel = dateSel.slice(0, 7);
monthsSel = [monthSel];
const _wk = new Date(); _wk.setDate(_wk.getDate() - 6);
rangeStart = fmtDate(_wk); rangeEnd = dateSel;
renderControls();
load();
setInterval(load, REFRESH_MINUTES * 60 * 1000);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && lastUpdate && Date.now() - lastUpdate > REFRESH_MINUTES * 60 * 1000) load();
});
</script>
</body>
</html>
